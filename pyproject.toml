[project]
name = "myagent"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "argon2-cffi>=25.1.0",
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "llm>=0.36",
    "mcp[cli]>=1.28,<2",
    "myapplication>=0.1.0",
    "psycopg[binary,pool]>=3.3.6",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
[tool.pytest.ini_options]
asyncio_mode= "auto"
testpaths= ["test"]
markers= ["slow:需要真实llm"]
